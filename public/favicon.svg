<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b291d"/>
      <stop offset="50%" stop-color="#071811"/>
      <stop offset="100%" stop-color="#030c08"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="30%" stop-color="#f3d078"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6b12"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Gold Rim -->
  <circle cx="256" cy="256" r="248" fill="url(#goldGrad)"/>
  <!-- Emerald Luxury Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#emeraldGrad)"/>
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.8"/>
  <!-- Royal Crown -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <path d="M128 335 L384 335 L368 365 L144 365 Z"/>
    <path d="M130 325 L112 195 L195 265 L256 142 L317 265 L400 195 L382 325 Z"/>
    <circle cx="112" cy="185" r="15"/>
    <circle cx="195" cy="255" r="12"/>
    <circle cx="256" cy="130" r="20"/>
    <circle cx="317" cy="255" r="12"/>
    <circle cx="400" cy="185" r="15"/>
  </g>
  <!-- Bride Name Tag -->
  <text x="256" y="424" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">LILIAN</text>
</svg>
